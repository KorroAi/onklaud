<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Comptoir · Boulangerie des Halles, démo Onklaud</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../commun/base.css">
<style>
  :root { --accent: #8a4a1f; }
  html, body { height: 100%; }
  body { background: #fbf8f4; color: #2b1a0f; font: 400 14.5px/1.45 "Inter", system-ui, sans-serif; letter-spacing: -.008em; -webkit-font-smoothing: antialiased; }
  .en-tete { display: flex; align-items: center; gap: 16px; padding: 16px 28px; border-bottom: 1px solid #eee3d6; background: #fff; }
  .en-tete h1 { font: 500 24px/1.1 "Fraunces", serif; letter-spacing: -.01em; }
  .en-tete span { color: #8c6a4f; }
  .en-tete .chiffre { margin-left: auto; text-align: right; }
  .en-tete .chiffre b { display: block; color: #2b1a0f; font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .grille { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 20px; padding: 20px 28px 32px; align-items: start; }
  h2 { margin-bottom: 12px; font-size: 15px; font-weight: 650; }
  .commande { display: grid; grid-template-columns: 74px 1fr auto; gap: 14px; align-items: center; margin-bottom: 10px; padding: 14px 16px; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(60, 40, 20, .07); }
  .commande.neuve { animation: arrive 1.6s cubic-bezier(.2, .8, .2, 1); }
  .commande.prete { opacity: .62; }
  .commande .h { font-size: 19px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .commande b { font-weight: 600; font-size: 15.5px; }
  .commande small { display: block; color: #8c6a4f; font-size: 13.5px; }
  .commande button { min-width: 142px; padding: 9px 13px; border: 0; border-radius: 10px; background: #8a4a1f; color: #fff; font-weight: 600; }
  .commande button.calme { background: #f1e7dc; color: #8a4a1f; }
  @keyframes arrive { 0% { transform: translateY(-10px); box-shadow: 0 0 0 3px #e7a74f; } 25% { transform: none; box-shadow: 0 0 0 3px #e7a74f; } }
  .production { padding: 18px; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(60, 40, 20, .07); }
  .ligne { display: grid; grid-template-columns: 1fr auto; padding: 9px 0; border-bottom: 1px solid #f3ebe1; font-size: 15px; }
  .ligne:last-child { border: 0; }
  .ligne b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .imprimer { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 10px; background: #2b1a0f; color: #fff; font-weight: 600; }
  @media (max-width: 800px) { .grille { grid-template-columns: 1fr; padding: 14px; } .en-tete { padding: 12px 14px; } .commande { grid-template-columns: 58px 1fr; } .commande button { grid-column: 1 / -1; } }
  @media print { .en-tete, .bandeau-demo, #colonne, .imprimer { display: none !important; } .grille { display: block; } }
</style>
</head>
<body>
<header class="en-tete"><h1 data-marque>Boulangerie des Halles</h1><span id="date"></span><div class="chiffre"><b id="total">0 €</b><span>commandé pour demain</span></div></header>
<main class="grille">
  <section id="colonne"><h2>Commandes de demain</h2><div id="commandes"></div></section>
  <section class="production"><h2>À produire pour demain</h2><div id="production"></div><button class="imprimer" onclick="window.print()">Imprimer la liste</button></section>
</main>
<script src="../commun/magasin.js"></script>
<script src="donnees.js"></script>
<script>
(function () {
  "use strict";
  const O = window.Outils, B = window.Boulangerie, esc = O.esc;
  const m = window.Magasin("boulangerie", B.depart);
  const $ = (s) => document.querySelector(s);
  const SUIVANT = { afaire: "prepa", prepa: "prete", prete: "retiree" };
  const BOUTON = { afaire: "Commencer", prepa: "Prête, prévenir le client", prete: "Remise au client" };
  const ORDRE = (a, b) => B.CRENEAUX.indexOf(a.heure) - B.CRENEAUX.indexOf(b.heure) || a.num - b.num;
  const texte = (l) => Object.entries(l).map(([k, q]) => q + " × " + (B.PRODUITS.find((p) => p.id === k) || { nom: k }).nom.toLowerCase()).join(", ");
  const vues = new Set(m.d.commandes.map((c) => c.id));
  const rendre = () => {
    const l = m.d.commandes.slice().sort(ORDRE);
    $("#date").textContent = O.dateLongue(O.jour(1));
    $("#total").textContent = O.eur(l.reduce((t, c) => t + B.total(c.lignes), 0));
    $("#commandes").innerHTML = l.map((c) => '<article class="commande ' + (c.etat === "prete" || c.etat === "retiree" ? "prete " : "") + (vues.has(c.id) ? "" : "neuve") + '" data-id="' + c.id + '"><span class="h">' + c.heure + "</span><div><b>N° " + c.num + ", " + esc(c.nom) + "</b><small>" + esc(texte(c.lignes)) + "</small></div>" + (BOUTON[c.etat] ? '<button class="' + (c.etat === "prete" ? "calme" : "") + '" data-etat="' + c.id + '">' + BOUTON[c.etat] + "</button>" : "<span>Remise</span>") + "</article>").join("");
    l.forEach((c) => vues.add(c.id));
    const tot = {};
    l.forEach((c) => Object.entries(c.lignes).forEach(([k, q]) => { tot[k] = (tot[k] || 0) + q; }));
    $("#production").innerHTML = B.PRODUITS.filter((p) => tot[p.id]).map((p) => '<div class="ligne"><span>' + esc(p.nom) + "</span><b>" + tot[p.id] + "</b></div>").join("");
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-etat]"); if (!b) return;
    m.maj((d) => { const c = d.commandes.find((x) => x.id === b.dataset.etat); c.etat = SUIVANT[c.etat]; });
  });
  m.surChange(rendre);
  window.bandeauDemo(m, "../", "ouvrez <a href=\"./\" target=\"_blank\" rel=\"noopener\">l’application client</a> et passez commande. Cliquez ensuite sur « Commencer », puis « Prête ».");
  rendre();
  window.demoComptoir = { m, rendre };
})();
</script>
</body>
</html>
