<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffc800">
<title>Mon chantier · Atelier Morel, démo Onklaud</title>
<link rel="manifest" href="chantier.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="appli" id="appli">
  <div class="statut-ios"><span>9:41</span><svg viewBox="0 0 66 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><rect x="42" y="1" width="20" height="10" rx="3"/><rect x="63" y="4" width="2" height="4" rx="1"/></svg></div>
  <div class="appli-corps" id="corps"></div>
  <div id="pied"></div>
  <nav class="onglets-ios" id="onglets" aria-label="Sections"></nav>
</div>
<div class="alerte-ios" id="alerte" role="status"></div>
<script src="../commun/magasin.js"></script>
<script src="donnees.js"></script>
<script>
(function () {
  "use strict";
  const O = window.Outils, A = window.AtelierMorel, esc = O.esc;
  const m = window.Magasin("atelier-morel", A.depart, A.automatismes);
  const $ = (s, r = document) => r.querySelector(s);
  const MOI = "martin";
  const ONGLETS = [
    ["chantier", "Chantier", '<path d="M4 20V10l8-6 8 6v10"/><path d="M10 20v-6h4v6"/>'],
    ["photos", "Photos", '<rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.500"/><path d="M9 6l1.500-2h3L15 6"/>'],
    ["messages", "Messages", '<path d="M4 6a2 2 0 012-2h12a2 2 0 012 2v9a2 2 0 01-2 2H9l-5 4z"/>'],
    ["documents", "Documents", '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/>']
  ];
  const ui = { onglet: new URLSearchParams(location.search).get("onglet") || "chantier", devis: null, chantier: "c-martin" };
  const ch = () => m.d.chantiers.find((c) => c.id === ui.chantier) || m.d.chantiers.find((c) => c.client === MOI);
  const mesDevis = () => m.d.devis.filter((x) => x.client === MOI);
  const COCHE = '<svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>';

  const alerte = (titre, texte) => {
    const a = $("#alerte");
    a.innerHTML = "<i>" + esc(O.initiales("AM")) + "</i><div><b>" + esc(titre) + "</b>" + esc(texte) + "</div>";
    a.classList.add("visible");
    clearTimeout(alerte.t); alerte.t = setTimeout(() => a.classList.remove("visible"), 4200);
  };

  const tete = (titre, sous) => '<header class="tete"><p class="societe"><span>' + esc(A.MARQUE) + '</span></p><h1 class="grand-titre">' + esc(titre) + '</h1><p class="sous-titre">' + esc(sous) + "</p></header>";

  const vueChantier = () => {
    const c = ch(), ph = c.photos[c.photos.length - 1], d = c.messages[c.messages.length - 1];
    const faites = c.etapes.filter((e) => e.e === "fait").length;
    return tete(c.titre, c.adresse) + '<div class="jauge-c"><b>' + faites + " / " + c.etapes.length + '</b>étapes terminées<div>' + c.etapes.map((e, i) => '<i class="' + (i < faites ? "on" : "") + '"></i>').join("") + "</div></div>" +
      (ph ? '<figure class="phare"><img src="' + esc(ph) + '" alt="Dernière photo du chantier"><span>Dernière photo</span></figure>' : "") +
      '<p class="entete-groupe">Avancement</p><div class="groupe">' + c.etapes.map((e, i) => '<div class="cellule"><span class="pastille ' + e.e + '">' + (e.e === "fait" ? COCHE : i + 1) + '</span><div class="texte"><b>' + esc(e.t) + "</b>" + (e.n && e.e === "encours" ? "<small>" + esc(e.n) + "</small>" : "") + '</div><span class="etat ' + e.e + '">' + ({ fait: "Terminé", encours: "En cours", avenir: "À venir" }[e.e]) + "</span></div>").join("") + "</div>" +
      (d ? '<p class="entete-groupe">Dernier message</p><div class="groupe"><button class="cellule" data-onglet="messages"><span class="avatar">' + esc(d.nom[0]) + '</span><div class="texte"><b>' + esc(d.nom) + "</b><small>" + esc(d.texte) + "</small></div></button></div>" : "");
  };
  const vuePhotos = () => {
    const c = ch();
    return tete("Photos", "Partagées par l’équipe et par vous") + '<div class="mosaique-ph">' + c.photos.slice().reverse().map((p) => '<img src="' + esc(p) + '" alt="Photo du chantier">').join("") + '</div><label class="bouton-ios" style="box-sizing:border-box;cursor:pointer">Ajouter une photo<input type="file" accept="image/*" id="photo" hidden></label>';
  };
  const vueMessages = () => {
    const c = ch();
    return tete("Messages", c.titre) + '<div class="fil" id="fil">' + c.messages.map((x) => '<div class="msg ' + (x.de === "client" ? "moi" : "") + '">' + esc(x.texte) + "<small>" + esc(x.nom) + " · " + esc(x.h) + "</small></div>").join("") + "</div>";
  };
  const vueDocuments = () => {
    if (ui.devis) return vueDevis();
    const l = mesDevis();
    return tete("Documents", "Devis et factures") + '<p class="entete-groupe">Devis</p><div class="groupe">' + l.map((x) => '<button class="cellule" data-devis="' + x.id + '"><div class="texte"><b>' + esc(x.objet) + "</b><small>" + x.num + " · " + O.eur(A.totalHT(x) * (1 + A.TVA), 0) + '</small></div><span class="droite" style="color:' + (x.statut === "signe" ? "#1c7c4a" : "#c26a00") + '">' + (x.statut === "signe" ? "Signé" : "À signer") + "</span></button>").join("") + '</div><p class="entete-groupe">Factures</p><div class="groupe">' +
      (m.d.factures.filter((f) => f.client === MOI).map((f) => '<div class="cellule"><div class="texte"><b>' + esc(f.objet) + "</b><small>" + f.num + '</small></div><span class="droite">' + O.eur(f.ttc, 0) + "</span></div>").join("") || '<div class="cellule"><div class="texte"><small>Aucune facture.</small></div></div>') + "</div>";
  };
  const vueDevis = () => {
    const x = m.d.devis.find((y) => y.id === ui.devis), ht = A.totalHT(x), signe = x.statut === "signe";
    return '<header class="tete"><p class="societe"><button data-action="retour">‹ Documents</button><span>' + x.num + '</span></p><h1 class="grand-titre">' + esc(x.objet) + '</h1></header><div class="groupe" style="margin-top:16px">' + x.lignes.map((l) => '<div class="cellule"><div class="texte"><b>' + esc(l.d) + "</b><small>" + l.q + " " + esc(l.q > 1 && l.u === "jour" ? "jours" : l.u) + " × " + O.eur(l.pu, 0) + '</small></div><span class="droite">' + O.eur(l.q * l.pu, 0) + "</span></div>").join("") + '<div class="cellule"><div class="texte"><small>TVA 10 %</small></div><span class="droite">' + O.eur(ht * A.TVA, 0) + '</span></div><div class="cellule"><div class="total-d texte" style="display:flex"><span>Total TTC</span><span>' + O.eur(ht * (1 + A.TVA), 0) + "</span></div></div></div>" +
      (signe ? '<p class="entete-groupe">Signature</p><div class="groupe"><div class="cellule"><span class="pastille fait">' + COCHE + '</span><div class="texte"><b>Devis signé</b><small>' + esc(A.MARQUE) + ' a été prévenu.</small></div></div></div>' :
        '<p class="entete-groupe">Signez avec le doigt</p><canvas class="signature" id="sig" aria-label="Zone de signature"></canvas><button class="lien-efface" data-action="effacer">Effacer</button><button class="bouton-ios" id="signer" data-action="signer" disabled>Signer le devis</button>');
  };

  let dessine = false;
  const brancherSignature = () => {
    const c = $("#sig"); if (!c) return;
    const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    const x = c.getContext("2d"); x.scale(dpr, dpr); x.lineWidth = 2.6; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#22272b";
    let actif = false;
    const pt = (e) => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    c.addEventListener("pointerdown", (e) => { actif = true; try { c.setPointerCapture(e.pointerId); } catch (_) { /* pointeur simulé */ } x.beginPath(); x.moveTo(...pt(e)); });
    c.addEventListener("pointermove", (e) => { if (!actif) return; x.lineTo(...pt(e)); x.stroke(); if (!dessine) { dessine = true; $("#signer").disabled = false; } });
    c.addEventListener("pointerup", () => { actif = false; });
  };

  const rendre = () => {
    const ancien = $("#corps").scrollTop;
    $("#corps").innerHTML = { chantier: vueChantier, photos: vuePhotos, messages: vueMessages, documents: vueDocuments }[ui.onglet]();
    $("#pied").innerHTML = ui.onglet === "messages" ? '<form class="saisie" id="saisie"><input name="t" placeholder="Écrire à l’équipe" aria-label="Écrire à l’équipe" autocomplete="off"><button>Envoyer</button></form>' : "";
    $("#onglets").innerHTML = ONGLETS.map(([k, t, i]) => '<button data-onglet="' + k + '" aria-current="' + (ui.onglet === k) + '"><svg viewBox="0 0 24 24">' + i + "</svg>" + t + "</button>").join("");
    if (ui.onglet === "messages") $("#corps").scrollTop = 1e6; else $("#corps").scrollTop = ancien;
    dessine = false; brancherSignature();
  };

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-onglet],[data-devis],[data-action]"); if (!b) return;
    const ds = b.dataset;
    if (ds.onglet) { ui.onglet = ds.onglet; ui.devis = null; rendre(); $("#corps").scrollTop = 0; }
    if (ds.devis) { ui.devis = ds.devis; rendre(); $("#corps").scrollTop = 0; }
    if (ds.action === "retour") { ui.devis = null; rendre(); }
    if (ds.action === "effacer") { rendre(); }
    if (ds.action === "signer") {
      const sig = $("#sig").toDataURL("image/png");
      m.maj((d) => { const x = d.devis.find((y) => y.id === ui.devis); x.statut = "signe"; x.signature = sig; x.signeLe = O.jour(); });
      alerte("Devis signé", A.MARQUE + " a bien reçu votre signature.");
    }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "saisie") return;
    e.preventDefault();
    const t = e.target.t.value.trim(); if (!t) return;
    m.maj((d) => { d.chantiers.find((c) => c.id === ch().id).messages.push({ de: "client", nom: "Mme Martin", h: O.maintenant(), texte: t }); });
  });
  document.addEventListener("change", async (e) => {
    if (e.target.id !== "photo" || !e.target.files[0]) return;
    const p = await O.photo(e.target.files[0]);
    const c = () => m.d.chantiers.find((x) => x.id === ch().id);
    const ok = m.maj(() => { c().photos.push(p); });
    if (!ok) { m.maj(() => { c().photos.pop(); }); alerte("Photo non enregistrée", "Le stockage de ce navigateur est plein."); }
  });

  let derniersMsg = ch().messages.length, etapesFaites = ch().etapes.filter((x) => x.e === "fait").length;
  m.surChange(() => {
    const c = ch();
    const f = c.etapes.filter((x) => x.e === "fait").length;
    if (c.messages.length > derniersMsg) { const x = c.messages[c.messages.length - 1]; if (x.de === "pro") alerte(x.nom, x.texte); }
    derniersMsg = c.messages.length; etapesFaites = f;
    rendre();
  });
  window.bandeauDemo(m, "../", "ouvrez Documents, signez le devis de la terrasse, puis regardez <a href=\"./\" target=\"_blank\" rel=\"noopener\">le logiciel de l’entreprise</a>.");
  rendre();
  window.demoChantier = { m, ui, rendre };
})();
</script>
</body>
</html>
