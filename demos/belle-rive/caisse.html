<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Caisse · Institut Belle Rive, démo Onklaud</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../commun/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="en-tete"><h1 data-marque>Institut Belle Rive</h1><span id="date"></span></header>
<main>
  <h2>Rendez-vous</h2><div id="agenda"></div>
  <h2>Cartes de fidélité</h2><div id="clientes"></div>
</main>
<script src="../commun/magasin.js"></script>
<script src="donnees.js"></script>
<script>
(function () {
  "use strict";
  const O = window.Outils, B = window.BelleRive, esc = O.esc;
  const m = window.Magasin("belle-rive", B.depart);
  const $ = (s) => document.querySelector(s);
  const rendre = () => {
    $("#date").textContent = O.dateLongue(O.jour());
    const rang = (r) => r.jour + String(B.HEURES.indexOf(r.heure)).padStart(2, "0");
    $("#agenda").innerHTML = m.d.rdv.slice().sort((a, b) => rang(a).localeCompare(rang(b))).map((r) => {
      const c = m.d.clientes.find((x) => x.id === r.cliente), p = B.PRESTATIONS.find((x) => x.id === r.prestation);
      return '<div class="rdv"><b>' + r.heure + "</b><span>" + esc(c.nom) + "<small>" + esc(p.nom) + ", " + O.dateCourte(r.jour) + "</small></span></div>";
    }).join("") || '<p class="vide">Aucun rendez-vous.</p>';
    $("#clientes").innerHTML = m.d.clientes.map((c) => {
      const pleine = c.tampons >= B.OBJECTIF;
      return '<div class="cliente"><span class="rond">' + esc(c.nom.split(" ").map((x) => x[0]).join("")) + "</span><b>" + esc(c.nom) + '</b><span class="compte">' + c.tampons + " tampons sur " + B.OBJECTIF + '</span><div class="barre-f">' + Array.from({ length: B.OBJECTIF }, (_, i) => '<i class="' + (i < c.tampons ? "on" : "") + '"></i>').join("") + "</div>" + (pleine ? '<button class="offert" data-offrir="' + c.id + '">Offrir le soin</button>' : '<button data-tampon="' + c.id + '">Ajouter un tampon</button>') + "</div>";
    }).join("");
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-tampon],[data-offrir]"); if (!b) return;
    m.maj((d) => { const c = d.clientes.find((x) => x.id === (b.dataset.tampon || b.dataset.offrir)); c.tampons = b.dataset.tampon ? c.tampons + 1 : 0; });
  });
  m.surChange(rendre);
  window.bandeauDemo(m, "../", "ouvrez <a href=\"./\" target=\"_blank\" rel=\"noopener\">l’application de Camille</a>, puis ajoutez-lui un tampon ici.");
  rendre();
  window.demoCaisse = { m, rendre };
})();
</script>
</body>
</html>
